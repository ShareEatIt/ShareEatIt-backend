plugins {
	id 'java'
	id 'org.springframework.boot' version '3.3.4'
	id 'io.spring.dependency-management' version '1.1.6'
}

group = 'com.carpBread'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(17)
	}
}

configurations {
	compileOnly {
		extendsFrom annotationProcessor
	}
}

repositories {

	maven {
		url 'https://repo.osgeo.org/repository/release'
	}
	mavenCentral()

}

jar {
	enabled = false
}



dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-data-mongodb'
	implementation 'org.springframework.boot:spring-boot-starter-oauth2-client'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-web'
	developmentOnly 'org.springframework.boot:spring-boot-devtools'

	compileOnly 'org.projectlombok:lombok'
	runtimeOnly 'com.mysql:mysql-connector-j'
	annotationProcessor 'org.projectlombok:lombok'

	// http 요청 request
	implementation 'org.springframework.boot:spring-boot-starter-webflux'
	implementation 'org.apache.httpcomponents.client5:httpclient5:5.2'

	// jwt 관련 import
	implementation 'io.jsonwebtoken:jjwt-api:0.11.5'
	implementation 'io.jsonwebtoken:jjwt-impl:0.11.5'
	implementation 'io.jsonwebtoken:jjwt-jackson:0.11.5'

	// aws 관련 - 경량구성 가능하도록 aws에서 제공한 sdk 사용
	implementation platform('com.amazonaws:aws-java-sdk-bom:1.12.529')
	implementation 'com.amazonaws:aws-java-sdk-s3'

	testImplementation "io.findify:s3mock_2.13:0.2.6"

	// redis - for logout
	implementation 'org.springframework.boot:spring-boot-starter-data-redis'

	// querydsl
	implementation 'com.querydsl:querydsl-jpa:5.0.0:jakarta'
	annotationProcessor 'com.querydsl:querydsl-apt:5.0.0:jakarta'
	annotationProcessor 'jakarta.annotation:jakarta.annotation-api'
	annotationProcessor 'jakarta.persistence:jakarta.persistence-api'

	// test - mysql db
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'com.mysql:mysql-connector-j' // MySQL 8.0.31 버전부터 groupid와 artifactid를 다음과 같이 작성해줘야 함

	// GeoTools
	implementation 'org.geotools:gt-main:27.0'         // GeoTools 메인 라이브러리
	implementation 'org.geotools:gt-cql:27.0'          // GeoTools의 필터 및 쿼리 기능
	implementation 'org.geotools:gt-epsg-hsql:27.0'    // 좌표 변환을 위한 EPSG 데이터베이스
	implementation 'org.hibernate:hibernate-spatial:6.2.6.Final' // Hibernate Spatial for JPA support

	// websocket
	implementation 'org.springframework.boot:spring-boot-starter-websocket'
	// stomp
	implementation 'org.webjars:stomp-websocket:2.3.3-1'

	// sentry : 로그 시스템
	implementation 'io.sentry:sentry-spring-boot-starter-jakarta:7.20.0'

	testImplementation 'org.springframework.security:spring-security-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

	implementation 'org.springframework.boot:spring-boot-starter-validation'
}

tasks.withType(JavaCompile) {
	options.compilerArgs << "-parameters"
}


tasks.named('test') {
	useJUnitPlatform()
}

// querydsl config
def querydslDir = layout.buildDirectory.dir("generated/querydsl").get().asFile

sourceSets {
	main.java.srcDirs += [ querydslDir ]
}

tasks.withType(JavaCompile).configureEach {
	options.getGeneratedSourceOutputDirectory().set(file(querydslDir))
}



clean.doLast {
	file(querydslDir).deleteDir()
}

