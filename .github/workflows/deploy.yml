name: Java CI with Gradle

on:
  push:
    branches: [ "deploy" ]

# Workflow 내에서 사용하는 환경 변수 정의
env:
  AWS_REGION: ap-northeast-2
  S3_BUCKET_NAME: shareeat-github-actions-s3-bucket
  CODE_DEPLOY_APPLICATION_NAME: shareeat-codedeploy-app
  CODE_DEPLOY_DEPLOYMENT_GROUP_NAME: shareeat-codedeploy-deployment-group
  DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}

# GITHUB_TOKEN에 부여하는 기본 권한 설정
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
    - uses: actions/checkout@v4
    - name: set up jdk 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        
    - name: setup Gradle
      uses: gradle/actions/setup-gradle@417ae3ccd767c252f5661f1ace9f835f9654f2b5

    - name: make application.yml
      run: |
          mkdir ./src/main/resources 
          cd ./src/main/resources
          touch ./application.yml
          echo "${{ secrets.ELB_APPLICATION_YML }}" > ./application.yml
          cd /
        
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build with Gradle
      run: |
        ./gradlew clean
        ./gradlew build -x test

    - name: share-eat-it-elb Docker Image Build
      run: |
        docker login -u ${{ secrets.DOCKER_USERNAME }} -p ${{ secrets.DOCKER_PASSWORD }}
        docker build --platform linux/arm64 -f Dockerfile -t ${{ secrets.DOCKER_USERNAME }}/share-eat-it-elb:latest .
        docker push ${{ secrets.DOCKER_USERNAME }}/share-eat-it-elb:latest

    - name: Upload docker-compose.yml to HOST 1
      uses: appleboy/scp-action@master
      with:
        host: ${{ secrets.ELB_HOST_1 }}
        username: ubuntu
        key: ${{ secrets.ELB_HOST_KEY_1 }}
        source: "docker-compose.yml"
        target: "/home/ubuntu/"

    - name: Upload docker-compose.yml to HOST 2
      uses: appleboy/scp-action@master
      with:
        host: ${{ secrets.ELB_HOST_2 }}
        username: ubuntu
        key: ${{ secrets.ELB_HOST_KEY_2 }}
        source: "docker-compose.yml"
        target: "/home/ubuntu/"

    - name: Deploy to server 1
      uses: appleboy/ssh-action@master
      with: 
        host: ${{ secrets.ELB_HOST_1 }}
        username: ubuntu
        key: ${{ secrets.ELB_HOST_KEY_1 }}
        script: |
          docker stop application-server-container
          docker rm $(docker ps -a --filter "status=exited" -q)
          docker rmi ${{ secrets.DOCKER_USERNAME }}/share-eat-it-elb

          docker login -u ${{ secrets.DOCKER_USERNAME }} -p ${{ secrets.DOCKER_PASSWORD }}
          docker pull ${{ secrets.DOCKER_USERNAME }}/share-eat-it-elb:latest
          docker-compose up -d
          
    - name: Deploy to server 2
      uses: appleboy/ssh-action@master
      with: 
        host: ${{ secrets.ELB_HOST_2 }}
        username: ubuntu
        key: ${{ secrets.ELB_HOST_KEY_2 }}
        script: |
          docker stop application-server-container
          docker rm $(docker ps -a --filter "status=exited" -q)
          docker rmi ${{ secrets.DOCKER_USERNAME }}/share-eat-it-elb

          docker login -u ${{ secrets.DOCKER_USERNAME }} -p ${{ secrets.DOCKER_PASSWORD }}
          docker pull ${{ secrets.DOCKER_USERNAME }}/share-eat-it-elb:latest
          docker-compose up -d


